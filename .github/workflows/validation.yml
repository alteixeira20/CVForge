name: CI

on:
  push:
    branches:
      - main
      - dev
      - fix/pdf-horizontal-bounds
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cvforge-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_SITE_URL: https://cvforge.example.invalid

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.5.2
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.CI_SITE_URL }}

      - name: Install Chromium for PDF bounds regression
        if: github.ref_name == 'fix/pdf-horizontal-bounds'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: PDF horizontal bounds regression
        if: github.ref_name == 'fix/pdf-horizontal-bounds'
        run: pnpm --filter web exec playwright test e2e/pdf-text.spec.ts --project=chromium

services:
  cvforge:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        RELEASE_ID: ${NEXT_PUBLIC_RELEASE_ID:-local}
    image: cvforge:latest
    ports:
      - "${CVFORGE_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_RELEASE_ID=${NEXT_PUBLIC_RELEASE_ID:-local}

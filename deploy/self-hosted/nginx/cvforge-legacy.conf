# Launch phase only: serve the previous hostname from the same release so
# visitors see the "CVForge has moved" notice and can export their JSON
# backup. Do not redirect: saved CVs live in that origin's browser storage.
# This replaces the existing cvforge.conf (which points at the old container).
server {
    listen 80;
    server_name cvforge.alexandreteixeira.dev;

    location / {
        proxy_pass http://cvforge-rc:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

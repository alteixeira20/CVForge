# Shared Nginx vhost for the new CVForge origin. Copy into the shared Nginx
# conf.d directory and reload that container. The application sends its own
# security headers (including CSP); do not add duplicates here.
server {
    listen 80;
    server_name cvforge.anvilary.tools;

    location / {
        proxy_pass http://cvforge-rc:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
